[project]
name = "haystack-fast-api"
version = "0.1.0"
description = "FastAPI service exposing Haystack pipelines over HTTP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "haystack-ai>=2.8.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.15.0",
    "numpy>=2.5.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "seaborn>=0.13.2",
    "langgraph>=1.2.10",
    "asyncpg>=0.31.0",
    "xgboost>=3.3.0",
    "joblib>=1.5.3",
    "pydantic>=2.13.4",
    "shap>=0.49.1",
    "numba>=0.61",
    "llvmlite>=0.44",
    "scikit-learn>=1.9.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "mdit-plain>=1.0.1",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.15.0",
    "trafilatura>=2.2.0",
    "ragas>=0.3.7",
    "langchain-core>=1.5.5",
    "langchain-community>=0.3.0,<0.4",
    "nltk>=3.10.2",
    "httpx2>=2.9.1",
    "pgvector-haystack>=3.0.0",
]

[project.optional-dependencies]
neo4j = [
    "neo4j>=5.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-html>=4.1.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "faker>=40.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# HTML report: reports/pytest-report.html (self-contained CSS/JS).
# Override path: uv run pytest --html=reports/custom.html --self-contained-html
# Disable for a single run: uv run pytest -p no:html -o addopts=
addopts = [
    "--html=reports/pytest-report.html",
    "--self-contained-html",
]
markers = [
    "pgvector: needs Postgres with pgvector extension (optional; skip unless RUN_PGVECTOR_TESTS=1)",
    "neo4j: needs a live Neo4j Bolt endpoint (optional; skip unless RUN_NEO4J_TESTS=1)",
]

[tool.uv]
# CVE-2025-69872: diskcache <=5.6.3 pickles cache files and has no patched release.
# ragas lists it only for optional DiskCacheBackend; this app never enables that path.
exclude-dependencies = ["diskcache"]
# Ignore packages published in the last 7 days (malicious/unstable releases).
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py312"
