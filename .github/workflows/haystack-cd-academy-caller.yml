# =============================================================================
# Install into: haystack-fast-api
# Path:         .github/workflows/haystack-cd-academy-caller.yml
# =============================================================================
# Also copy:
#   deploy-pipeline/haystack-cd-academy.yml → .github/workflows/
#   deploy-pipeline/resolve-aws-profile/action.yml → .github/actions/resolve-aws-profile/
#   deploy-pipeline/ansible/ → deploy-pipeline/ansible/  (keep this path)
#
# Haystack app CD (Academy) — branch 2 compose.
# Not CI. Not terraform. Re-runs guest_base + haystack on existing asg-haystack.
# No neo4j container.
# =============================================================================

name: Haystack CD (Academy)

on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy a CI image, refresh .env, or health only
        required: true
        type: choice
        default: verify
        options:
          - deploy
          - configure-only
          - verify
      aws_environment:
        description: Must be academy (Vocareum Learner Lab)
        required: true
        type: environment
        default: academy
      image_ref:
        description: Public GHCR or ECR tag (required for deploy unless HAYSTACK_IMAGE is set)
        required: false
        type: string
        default: ""
      image_http_url:
        description: HTTPS or s3:// CI image tar.gz (empty = vars.IMAGE_HTTP_URL)
        required: false
        type: string
        default: ""
      aws_access_key_id:
        description: Vocareum AWS Details access key. Empty = Environment academy.
        required: false
        type: string
        default: ""
      aws_secret_access_key:
        description: Vocareum secret access key. Empty = Environment academy.
        required: false
        type: string
        default: ""
      aws_session_token:
        description: Vocareum session token. Empty = Environment academy.
        required: false
        type: string
        default: ""

concurrency:
  group: haystack-cd-academy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required to call haystack-cd-academy.yml (shared with paid OIDC).
  # Academy still authenticates with Vocareum keys, not GitHub OIDC.
  id-token: write

jobs:
  refuse-non-academy:
    name: Assert Environment academy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse non-academy
        env:
          ENV_NAME: ${{ inputs.aws_environment }}
        run: |
          set -euo pipefail
          if [ "${ENV_NAME}" != "academy" ]; then
            echo "::error::This Action is AWS Academy / Vocareum only (got '${ENV_NAME}'). Use Haystack CD (paid) with Environment AWS_ACTUAL."
            exit 1
          fi

  haystack-cd:
    name: Haystack CD pipeline
    needs: [refuse-non-academy]
    uses: ./.github/workflows/haystack-cd-academy.yml
    permissions:
      contents: read
      id-token: write
    with:
      action: ${{ inputs.action }}
      aws_environment: ${{ inputs.aws_environment }}
      image_ref: ${{ inputs.image_ref }}
      image_http_url: ${{ inputs.image_http_url }}
      aws_access_key_id: ${{ inputs.aws_access_key_id }}
      aws_secret_access_key: ${{ inputs.aws_secret_access_key }}
      aws_session_token: ${{ inputs.aws_session_token }}
