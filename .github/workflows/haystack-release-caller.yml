# =============================================================================
# Install into: haystack-fast-api
# Path:         .github/workflows/haystack-release-caller.yml
# =============================================================================
# Release caller — manual dispatch only
# (Actions → Haystack Release Pipeline Invoke → Run workflow).
# Checks out master, QC, image, DAST, then public GHCR + GitHub Release.
# Do not use on: release — Publish in the reusable workflow creates the
# GitHub Release.
#
# Feature-branch PR validation remains CI (haystack-ci-caller.yml).
# SAST / CodeQL live on Integration CI, not this caller.
#
# Place both files in the FastAPI / Haystack application repository:
#
#   .github/workflows/haystack-release-caller.yml  ← this file (triggers)
#   .github/workflows/release-pipeline.yml         ← reusable pipeline (called)
#
# When this runs
# --------------
#   workflow_dispatch only (Actions → this workflow → Run workflow)
#
#   Does NOT run on:
#     - published GitHub Release (this pipeline creates that Release)
#     - pull request develop → master
#     - push to master/develop alone
#     - PRs from feature branches
#     - PRs into develop
#     - tag push alone
#
# Flow
# ----
#   feature → develop (CI) → merge to master → workflow_dispatch this pipeline
#     → Integration → QC → Packaging → DAST → Publish
#       (public GHCR haystack_recommender:<semver> + :latest + GitHub Release)
#
# Reusable workflow (same repository):
#   ./.github/workflows/release-pipeline.yml
#
# Setup
# -----
# 1. Copy into the haystack-fast-api repo:
#      .github/workflows/haystack-release-caller.yml
#      .github/workflows/release-pipeline.yml
# 2. GHCR push uses GITHUB_TOKEN (packages: write). No LLM / DB secrets.
#    Image: ghcr.io/<owner>/haystack_recommender:<x.y.z> and :latest.
# =============================================================================

name: Haystack Release Pipeline Invoke

on:
  workflow_dispatch:

concurrency:
  group: haystack-release-${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  security-events: write
  actions: read
  packages: write

jobs:
  release-pipeline:
    name: Release pipeline
    uses: ./.github/workflows/release-pipeline.yml
