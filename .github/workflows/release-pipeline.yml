# =============================================================================
# Heavy Rental haystack-fast-api — Release CI Pipeline (reusable)
# =============================================================================
# Stages (priority order — Integration is highest priority):
#   1. Integration      (HIGHEST) checkout master, Python 3.12 + uv, Haystack smoke
#   2. Quality Control  needs Integration — Ruff + pytest
#   3. Packaging        needs Integration + QC — uv build + Docker image tar
#   4. DAST             needs Packaging — run image, OWASP ZAP + Dastardly + Nuclei
#                       + combined-dast-report.pdf (artifact dast-combined-report-pdf)
#   5. Publish          needs Integration + Packaging + DAST — public GHCR +
#                       GitHub Release on master
#
# SAST/CodeQL live on Integration CI (develop), not Release.
# DAST (Release): ZAP JSON/HTML, Dastardly XML, Nuclei JSONL, plus
#   combined-dast-report.pdf (artifact dast-combined-report-pdf).
#
# GitHub Flow
# --------------------------------------------------------------------------
# Invoked via haystack-release-caller.yml on workflow_dispatch
# (Actions → Haystack Release Pipeline Invoke → Run workflow).
# Do not use on: release — Publish creates the GitHub Release.
# Feature-branch PR validation remains haystack-ci-caller.yml (Integration first).
#
#   feature → develop (CI) → merge to master → workflow_dispatch this pipeline
#
# Always generates a Python 3.12 + uv + uvicorn image (Haystack FastAPI).
# An app Dockerfile is not the deploy image. Portable:
#   docker run -p 8000:8000 -e DATABASE_URL=… <image>
# Endpoints: GET /docs and GET /health on :8000.
# The image is env-driven for estate keys: no lab hostnames, POSTGRES_*,
# SOURCE_* / TARGET_* (SoR → Haystack RDS sync), or NEO4J_URI in ENV/ARG.
# Product knobs come from a sanitized .env.prod copied to /app/.env
# (pydantic Settings env_file). Process env (compose SM / docker -e) wins.
# Packaging refuses baked ENV/ARG and estate secrets in that file, starts
# uvicorn briefly, and requires GET /docs or GET /health (200–302).
# It does not connect to RDS or an LLM. Packaging does not docker push;
# Publish pushes GHCR after DAST.
#
# Application:
#   https://github.com/Heavy-Rental/haystack-fast-api
#   Python 3.12 · uv · FastAPI · Haystack 2.x
#
# How haystack-fast-api uses this on release
# ------------------------------------------
# Install both files into the application repository:
#
#   .github/workflows/release-pipeline.yml            ← this file (reusable only)
#   .github/workflows/haystack-release-caller.yml     ← sole allowed entry point
#
# Local validation (pipeline-development repo root, in the devcontainer):
#   actionlint haystack-fast-api-pipeline/release-pipeline/release-pipeline.yml
#   act — see haystack-fast-api-pipeline/act/README.md
#
# GHCR push uses GITHUB_TOKEN (packages: write). No LLM / DB secrets.
# Registry image: ghcr.io/<owner>/haystack_recommender:<x.y.z> and :latest.
# <x.y.z> is the previous GHCR semver patch-bumped (first publish: 1.0.0).
# Image is saved as a gzipped tar for a later deploy project that cannot pull GHCR.
# This family does not provision infrastructure, deploy, or operate production.
# =============================================================================

name: Haystack Release Pipeline

on:
  workflow_call:
    inputs:
      app_repository:
        description: >
          Override application repository (owner/name). Leave empty to use the
          calling repository.
        required: false
        type: string
        default: ""
      app_ref:
        description: >
          Override git ref (branch/tag/SHA). Leave empty to use the calling
          workflow's commit (github.sha).
        required: false
        type: string
        default: ""

concurrency:
  group: haystack-release-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  security-events: write
  actions: read
  # Required for Publish to push the Docker image to GHCR
  packages: write

env:
  PYTHON_VERSION: "3.12"
  APP_PATH: app
  DEFAULT_APP_REPOSITORY: Heavy-Rental/haystack-fast-api
  DEFAULT_APP_REF: master
  IMAGE_NAME: haystack_recommender
  PYTHON_BASE_IMAGE: python:3.12-slim-bookworm
  # Stable artifact names so DAST/Publish do not depend on packaging job outputs.
  IMAGE_ARCHIVE: haystack_recommender-image.tar.gz
  IMAGE_META: image-meta.env
  NEED_DECOMPOSER: stub
  INDEXING_EMBEDDER: mock
  INDEXING_DOCUMENT_STORE: memory
  INDEXING_EMBEDDING_DIM: "384"
  FLEET_BACKEND: fake
  PRICING_SCHEMA: primary_snapshot
  NEO4J_BACKEND: fake
  RECOMMEND_VIA_AGENT_GRAPH: "false"
  KG_APPLY_TRANSFORMS: "false"
  PROJECT_AGENT_MODE: stub

jobs:
  assert-caller:
    name: Assert caller
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Allow only haystack-release-caller.yml
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          echo "github.workflow_ref=${WORKFLOW_REF}"
          echo "github.event_name=${EVENT_NAME}"
          echo "github.workflow=${WORKFLOW_NAME}"
          if [ "${ACT:-}" = "true" ] && [ -z "${WORKFLOW_REF}" ]; then
            echo "act local run: caller gate skipped (github.workflow_ref unset)"
            {
              echo "### Caller gate"
              echo ""
              echo "nektos/act — \`github.workflow_ref\` is empty; filename gate skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "${WORKFLOW_REF}" in
            */.github/workflows/haystack-release-caller.yml@*)
              echo "Allowed caller: haystack-release-caller.yml"
              {
                echo "### Caller gate"
                echo ""
                echo "Invoked by \`haystack-release-caller.yml\` — OK."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::release-pipeline.yml may only be invoked by .github/workflows/haystack-release-caller.yml (got: ${WORKFLOW_REF})"
              exit 1
              ;;
          esac

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [assert-caller]
    timeout-minutes: 30
    outputs:
      app_repository: ${{ steps.meta.outputs.app_repository }}
      app_ref: ${{ steps.meta.outputs.app_ref }}
      checkout_mode: ${{ steps.meta.outputs.checkout_mode }}
    steps:
      - name: Resolve application source (same-repo caller vs remote override)
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ inputs.app_repository }}
          INPUT_REF: ${{ inputs.app_ref }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          DEFAULT_APP_REF_VALUE: ${{ env.DEFAULT_APP_REF }}
        run: |
          set -euo pipefail
          EVENT="${EVENT_NAME}"
          INPUT_REPO="${INPUT_REPO}"
          INPUT_REF="${INPUT_REF}"

          if [ -n "${INPUT_REPO}" ] && [ "${INPUT_REPO}" != "${GH_REPOSITORY}" ]; then
            APP_REPO="${INPUT_REPO}"
            APP_REF="master"
            MODE=remote
          else
            APP_REPO="${GH_REPOSITORY}"
            APP_REF="master"
            MODE=caller
          fi

          echo "app_repository=$APP_REPO" >> "$GITHUB_OUTPUT"
          echo "app_ref=$APP_REF" >> "$GITHUB_OUTPUT"
          echo "checkout_mode=$MODE" >> "$GITHUB_OUTPUT"
          {
            echo "### Source resolution"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`$EVENT\` |"
            echo "| Mode | \`$MODE\` |"
            echo "| Repository | \`$APP_REPO\` |"
            echo "| Ref | \`$APP_REF\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Integrating application: $APP_REPO @ $APP_REF (mode=$MODE)"

      - name: Checkout calling repository (release / push head)
        if: steps.meta.outputs.checkout_mode == 'caller'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: master
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: steps.meta.outputs.checkout_mode == 'remote'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ steps.meta.outputs.app_repository }}
          ref: ${{ steps.meta.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: ${{ env.APP_PATH }}/uv.lock

      - name: Require uv.lock and sync frozen environment
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          if [ ! -f uv.lock ]; then
            echo "::error::uv.lock not found — this pipeline expects a locked uv project."
            exit 1
          fi
          uv --version
          python --version
          uv lock --check
          uv sync --frozen --all-groups

      - name: Verify project layout and Haystack / FastAPI smoke
        working-directory: ${{ env.APP_PATH }}
        env:
          PYTHON_VERSION_VALUE: ${{ env.PYTHON_VERSION }}
        run: |
          set -euo pipefail
          test -f pyproject.toml
          test -f uv.lock
          test -f .python-version
          test -f app/main.py
          test -f tests/conftest.py
          if [ -n "${LLM_API_KEY:-}" ]; then
            echo "::error::LLM_API_KEY must not be set in Integration."
            exit 1
          fi
          uv run python -c "
          import haystack
          from haystack import Pipeline
          from app.main import create_app
          from app.pipelines import build_indexing_pipeline, build_intake_front_pipeline

          print('haystack', getattr(haystack, '__version__', 'unknown'))
          app = create_app()
          print('fastapi', getattr(app, 'title', type(app).__name__))
          indexing = build_indexing_pipeline()
          intake = build_intake_front_pipeline()
          if not isinstance(indexing, Pipeline):
              raise SystemExit(f'indexing pipeline type={type(indexing)!r}')
          if not isinstance(intake, Pipeline):
              raise SystemExit(f'intake pipeline type={type(intake)!r}')
          print('Haystack/FastAPI smoke OK')
          "
          {
            echo "### Integration checks"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Runner Python | \`${PYTHON_VERSION_VALUE}\` |"
            echo "| Package manager | \`uv\` (frozen lock) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload uv project fingerprint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-integration-metadata
          path: |
            ${{ env.APP_PATH }}/pyproject.toml
            ${{ env.APP_PATH }}/uv.lock
          retention-days: 14
          if-no-files-found: warn

  quality-control:
    name: Quality Control
    runs-on: ubuntu-latest
    needs: [integration]
    timeout-minutes: 40
    steps:
      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: master
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: ${{ env.APP_PATH }}/uv.lock

      - name: Install locked environment
        working-directory: ${{ env.APP_PATH }}
        run: uv sync --frozen --all-groups

      - name: Ruff check and pytest
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          if [ -n "${LLM_API_KEY:-}" ]; then
            echo "::error::LLM_API_KEY must not be set in Quality Control."
            exit 1
          fi
          uv run ruff check app tests
          mkdir -p reports
          uv run pytest tests/
          {
            echo "### Quality control"
            echo ""
            echo "Ruff and pytest completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pytest HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-quality-test-reports
          path: ${{ env.APP_PATH }}/reports/pytest-report.html
          retention-days: 14
          if-no-files-found: warn

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    needs: [integration, quality-control]
    outputs:
      image_tag: ${{ steps.package.outputs.image_tag }}
      image_local: ${{ steps.package.outputs.image_local }}
      image_remote: ${{ steps.package.outputs.image_remote }}
      image_remote_latest: ${{ steps.package.outputs.image_remote_latest }}
      image_tar: ${{ steps.package.outputs.image_tar }}
      version: ${{ steps.package.outputs.version }}
    timeout-minutes: 30
    steps:
      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: master
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: ${{ env.APP_PATH }}/uv.lock

      - name: Build wheel and sdist
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          uv build
          echo "==> dist outputs"
          ls -lah dist || true

      - name: Resolve next haystack_recommender version
        id: image-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          OWNER="${GH_REPOSITORY_OWNER}"
          PKG="${IMAGE_NAME,,}"

          list_tags() {
            local path="$1"
            gh api --paginate "${path}" --jq '.[] | .metadata.container.tags[]?' 2>/dev/null || true
          }

          TAGS="$(list_tags "/orgs/${OWNER}/packages/container/${PKG}/versions")"
          if [ -z "${TAGS}" ]; then
            TAGS="$(list_tags "/users/${OWNER}/packages/container/${PKG}/versions")"
          fi

          PREV="$(printf '%s\n' "${TAGS}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [ -z "${PREV}" ]; then
            NEXT="1.0.0"
            PREV_DISPLAY="none"
          else
            IFS=. read -r MAJ MIN PAT <<< "${PREV}"
            NEXT="${MAJ}.${MIN}.$((PAT + 1))"
            PREV_DISPLAY="${PREV}"
          fi

          echo "previous_version=${PREV_DISPLAY}" >> "$GITHUB_OUTPUT"
          echo "image_version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Resolved GHCR image version: previous=${PREV_DISPLAY} next=${NEXT}"
          {
            echo "### GHCR image version"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${PKG}\` |"
            echo "| Previous semver | \`${PREV_DISPLAY}\` |"
            echo "| Next semver | \`${NEXT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage versioned and stable artifacts
        id: package
        working-directory: ${{ env.APP_PATH }}
        env:
          GH_RUN_NUMBER: ${{ github.run_number }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_VERSION: ${{ steps.image-version.outputs.image_version }}
          PREVIOUS_IMAGE_VERSION: ${{ steps.image-version.outputs.previous_version }}
        run: |
          set -euo pipefail
          WHEEL="$(find dist -maxdepth 1 -type f -name '*.whl' | head -n 1 || true)"
          SDIST="$(find dist -maxdepth 1 -type f -name '*.tar.gz' | head -n 1 || true)"
          if [ -z "${WHEEL}" ] || [ ! -f "${WHEEL}" ]; then
            echo "::error::No wheel produced under dist/ after uv build"
            ls -lah dist || true
            exit 1
          fi
          if [ -z "${SDIST}" ] || [ ! -f "${SDIST}" ]; then
            echo "::error::No sdist produced under dist/ after uv build"
            ls -lah dist || true
            exit 1
          fi

          VERSION="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          VERSION="${VERSION:-0.0.0}"
          SHORT_SHA="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          RUN_ID="${GH_RUN_NUMBER}"

          VERSIONED_WHEEL="haystack-fast-api-v${VERSION}-build${RUN_ID}-${SHORT_SHA}.whl"
          STABLE_WHEEL="haystack-fast-api.whl"
          VERSIONED_SDIST="haystack-fast-api-v${VERSION}-build${RUN_ID}-${SHORT_SHA}.tar.gz"
          STABLE_SDIST="haystack-fast-api.tar.gz"

          cp "${WHEEL}" "${GITHUB_WORKSPACE}/${VERSIONED_WHEEL}"
          cp "${WHEEL}" "${GITHUB_WORKSPACE}/${STABLE_WHEEL}"
          cp "${SDIST}" "${GITHUB_WORKSPACE}/${VERSIONED_SDIST}"
          cp "${SDIST}" "${GITHUB_WORKSPACE}/${STABLE_SDIST}"

          for f in \
            "${GITHUB_WORKSPACE}/${VERSIONED_WHEEL}" \
            "${GITHUB_WORKSPACE}/${STABLE_WHEEL}" \
            "${GITHUB_WORKSPACE}/${VERSIONED_SDIST}" \
            "${GITHUB_WORKSPACE}/${STABLE_SDIST}"
          do
            if [ ! -s "$f" ]; then
              echo "::error::Staged package is empty or missing: $f"
              exit 1
            fi
          done

          IMAGE_TAG="${IMAGE_VERSION}"
          if [ -z "${IMAGE_TAG}" ]; then
            echo "::error::Resolved image version is empty"
            exit 1
          fi
          IMAGE_NAME_LC="${IMAGE_NAME,,}"
          OWNER_LC="${GH_REPOSITORY_OWNER,,}"
          IMAGE_LOCAL="${IMAGE_NAME_LC}:${IMAGE_TAG}"
          IMAGE_LOCAL_LATEST="${IMAGE_NAME_LC}:latest"
          IMAGE_REMOTE="ghcr.io/${OWNER_LC}/${IMAGE_NAME_LC}:${IMAGE_TAG}"
          IMAGE_REMOTE_LATEST="ghcr.io/${OWNER_LC}/${IMAGE_NAME_LC}:latest"
          IMAGE_TAR="haystack_recommender-${IMAGE_TAG}.tar.gz"

          {
            echo "versioned_wheel=${VERSIONED_WHEEL}"
            echo "stable_wheel=${STABLE_WHEEL}"
            echo "versioned_sdist=${VERSIONED_SDIST}"
            echo "stable_sdist=${STABLE_SDIST}"
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "image_tag=${IMAGE_TAG}"
            echo "previous_image_version=${PREVIOUS_IMAGE_VERSION}"
            echo "image_local=${IMAGE_LOCAL}"
            echo "image_local_latest=${IMAGE_LOCAL_LATEST}"
            echo "image_remote=${IMAGE_REMOTE}"
            echo "image_remote_latest=${IMAGE_REMOTE_LATEST}"
            echo "image_tar=${IMAGE_TAR}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Packaging"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| version | \`${VERSION}\` |"
            echo "| Previous GHCR semver | \`${PREVIOUS_IMAGE_VERSION}\` |"
            echo "| Versioned wheel | \`${VERSIONED_WHEEL}\` |"
            echo "| Stable wheel | \`${STABLE_WHEEL}\` |"
            echo "| Versioned sdist | \`${VERSIONED_SDIST}\` |"
            echo "| Stable sdist | \`${STABLE_SDIST}\` |"
            echo "| Docker image (local) | \`${IMAGE_LOCAL}\` |"
            echo "| Docker image (GHCR) | \`${IMAGE_REMOTE}\` |"
            echo "| Docker image (GHCR latest) | \`${IMAGE_REMOTE_LATEST}\` |"
            echo "| Image archive | \`${IMAGE_TAR}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------------------
      # Docker image: always Python 3.12 + uv + uvicorn so any Docker Engine can run it.
      # An app Dockerfile is not the deploy image. Sidecar packages COPY only if present.
      # Product knobs: sanitized .env.prod → /app/.env (pydantic). Estate keys: -e / SM.
      # -------------------------------------------------------------------
      - name: Prepare Dockerfile for uvicorn image
        working-directory: ${{ env.APP_PATH }}
        env:
          PYTHON_BASE_IMAGE: ${{ env.PYTHON_BASE_IMAGE }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          APP_REPOSITORY: ${{ needs.integration.outputs.app_repository }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if [ ! -f app/main.py ]; then
            echo "::error::FastAPI entrypoint app/main.py is missing. Image CMD is uvicorn app.main:app."
            ls -la || true
            exit 1
          fi
          if [ ! -f pyproject.toml ] || [ ! -f uv.lock ]; then
            echo "::error::pyproject.toml and uv.lock are required to build the uvicorn image."
            exit 1
          fi

          if [ -f .dockerignore ]; then
            if grep -Eiq '^[[:space:]]*(\./)?app(/|\*|/\*)?[[:space:]]*$' .dockerignore \
              || grep -Eiq '^[[:space:]]*(\./)?pyproject\.toml[[:space:]]*$' .dockerignore; then
              echo "::error::.dockerignore excludes app/ or pyproject.toml; Release cannot COPY the FastAPI app."
              cat .dockerignore
              exit 1
            fi
          fi

          if [ -f Dockerfile ]; then
            echo "Application Dockerfile present — moving aside. Release always builds uv + uvicorn app.main:app :8000."
            mv Dockerfile Dockerfile.app-repo
          fi

          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          estate = {
              "POSTGRES_HOST", "POSTGRES_HOSTNAME", "POSTGRES_PORT",
              "POSTGRES_DATABASE", "POSTGRES_DB", "POSTGRES_USERNAME",
              "POSTGRES_USER", "POSTGRES_PASSWORD", "POSTGRES_URL", "DATABASE_URL",
              "SOURCE_HOST", "SOURCE_PORT", "SOURCE_DATABASE", "SOURCE_USER",
              "SOURCE_PASSWORD", "TARGET_HOST", "TARGET_PORT", "TARGET_DATABASE",
              "TARGET_USER", "TARGET_PASSWORD",
              "NEO4J_URI", "NEO4J_USER", "NEO4J_PASSWORD", "NEO4J_POPULATE_URL",
              "LLM_API_KEY",
          }
          secret_re = re.compile(
              r"(?i)(sk-[A-Za-z0-9]{10,}|whsec_|BEGIN (RSA |OPENSSH )?PRIVATE KEY)"
          )
          fallback = [
              ("APP_NAME", "haystack-fast-api"),
              ("APP_ENV", "prod"),
              ("LOG_LEVEL", "INFO"),
              ("NEED_DECOMPOSER", "stub"),
              ("LLM_BASE_URL", "https://inference.do-ai.run/v1"),
              ("LLM_MODEL", "router:default"),
              ("LLM_TIMEOUT_SECONDS", "60"),
              ("LLM_TEMPERATURE", "0.5"),
              ("INDEXING_EMBEDDER", "mock"),
              ("INDEXING_EMBEDDING_DIM", "384"),
              ("INDEXING_SPLIT_LENGTH", "200"),
              ("INDEXING_SPLIT_OVERLAP", "20"),
              ("INDEXING_OPENAI_EMBEDDING_MODEL", "text-embedding-3-small"),
              ("INDEXING_ST_MODEL", "sentence-transformers/all-MiniLM-L6-v2"),
              ("INDEXING_DOCUMENT_STORE", "memory"),
              ("INDEXING_CHUNK_TTL_SECONDS", "0"),
              ("IDEMPOTENCY_TTL_SECONDS", "86400"),
              ("INDEXING_VIA_AGENT_GATE", "false"),
              ("FLEET_BACKEND", "sql"),
              ("PRICING_SCHEMA", "primary_snapshot"),
              ("NEO4J_BACKEND", "bolt"),
              ("NEO4J_POPULATE_TIMEOUT_SECONDS", "2"),
              ("RECOMMEND_VIA_AGENT_GRAPH", "false"),
              ("RECOMMEND_FANOUT_CAP", "4"),
              ("KG_ARTIFACT_DIR", "artifacts/kg"),
              ("KG_APPLY_TRANSFORMS", "false"),
              ("PROJECT_AGENT_MODE", "stub"),
              ("PROJECT_AGENT_TOP_K", "5"),
          ]
          candidates = [
              Path(".env.prod"),
              Path("docs/samples/.env.prod"),
          ]
          src = next((p for p in candidates if p.is_file()), None)
          rows = []
          if src is not None:
              for raw in src.read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, _, val = line.partition("=")
                  key = key.strip()
                  val = val.strip().strip("'").strip('"')
                  if secret_re.search(val):
                      print(f"::error::{src} looks like it contains a secret in {key}.")
                      sys.exit(1)
                  if key == "LLM_API_KEY" and val:
                      print(f"::error::{src} sets LLM_API_KEY. Use Secrets Manager or academy secret.")
                      sys.exit(1)
                  if key == "NEO4J_URI" and val:
                      print(
                          f"::error::{src} sets NEO4J_URI={val}. "
                          "Infra sync-secrets owns Bolt NLB. Do not commit a compose hostname."
                      )
                      sys.exit(1)
                  rows.append((key, val))
              origin = str(src)
          else:
              rows = list(fallback)
              origin = "generated production defaults (no app .env.prod)"

          kept = []
          seen = set()
          for key, val in rows:
              if key in estate or not key:
                  continue
              if key not in seen:
                  kept.append((key, val))
                  seen.add(key)
          if "APP_ENV" not in seen:
              kept.insert(0, ("APP_ENV", "prod"))
          if not any(k == "APP_ENV" and v == "prod" for k, v in kept):
              print("::warning::.env.prod APP_ENV is not prod; image /app/.env will keep the file value.")
          out = Path("haystack.prod.env")
          out.write_text("".join(f"{k}={v}\n" for k, v in kept), encoding="utf-8")
          print(f"Wrote {out} from {origin} ({len(kept)} product keys). Estate keys stripped.")
          PY

          if [ -f .dockerignore ]; then
            if grep -Eiq '^[[:space:]]*(\./)?haystack\.prod\.env[[:space:]]*$' .dockerignore \
              || grep -Eiq '^[[:space:]]*\*\.env[[:space:]]*$' .dockerignore; then
              echo "::error::.dockerignore excludes haystack.prod.env (or *.env); Release cannot COPY the production profile."
              cat .dockerignore
              exit 1
            fi
          fi

          echo "Generating uvicorn Dockerfile (Haystack FastAPI → ${PYTHON_BASE_IMAGE})"
          {
            echo "# Generated by haystack-fast-api release packaging (FastAPI + Haystack)"
            echo "# Portable: docker run -p 8000:8000 -e KEY=… <image>"
            echo "# Product knobs: COPY haystack.prod.env → /app/.env (from app .env.prod)."
            echo "# Estate keys from infra heavy-rental/haystack (sync-secrets) or docker -e."
            echo "# Do not ENV/ARG any of these:"
            echo "#   Infra writes: DATABASE_URL, POSTGRES_*, SOURCE_*, TARGET_*,"
            echo "#     FLEET_BACKEND=sql, NEO4J_BACKEND=bolt, NEO4J_URI/USER/PASSWORD,"
            echo "#     optional LLM_API_KEY"
            echo "#   App knobs (file defaults; SM / academy overlay / -e override):"
            echo "#     APP_ENV, NEED_DECOMPOSER, LLM_BASE_URL, LLM_MODEL,"
            echo "#     INDEXING_*, FLEET_BACKEND, PRICING_SCHEMA, NEO4J_BACKEND, KG_*"
            echo "FROM ${PYTHON_BASE_IMAGE}"
            echo "COPY --from=ghcr.io/astral-sh/uv:latest /uv /uvx /bin/"
            echo "LABEL org.opencontainers.image.title=\"${IMAGE_NAME}\""
            echo "LABEL org.opencontainers.image.description=\"Heavy Rental Haystack FastAPI (uvicorn)\""
            echo "LABEL org.opencontainers.image.source=\"https://github.com/${APP_REPOSITORY}\""
            echo "LABEL org.opencontainers.image.revision=\"${SHORT_SHA}\""
            echo "LABEL org.opencontainers.image.version=\"${VERSION}\""
            echo ""
            echo "WORKDIR /app"
            echo "COPY pyproject.toml uv.lock README.md ./"
            echo "RUN uv sync --frozen --no-dev --extra neo4j --no-install-project"
            echo "COPY app ./app"
            echo "RUN uv sync --frozen --no-dev --extra neo4j"
            echo "COPY haystack.prod.env .env"
            if [ -d postgres_haystack_sync ]; then
              echo "COPY postgres_haystack_sync ./postgres_haystack_sync"
            fi
            if [ -d neo4j_populate ]; then
              echo "COPY neo4j_populate ./neo4j_populate"
            fi
            echo ""
            echo "EXPOSE 8000"
            echo "CMD [\"uv\", \"run\", \"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]"
          } > Dockerfile

          echo "==> Dockerfile"
          cat Dockerfile
          echo "==> haystack.prod.env (sanitized product profile)"
          cat haystack.prod.env

          if grep -Eiq '^[[:space:]]*(ENV|ARG)[[:space:]]+(POSTGRES_|SOURCE_|TARGET_|DATABASE_URL|NEED_DECOMPOSER|LLM_|INDEXING_|IDEMPOTENCY_|FLEET_BACKEND|PRICING_SCHEMA|NEO4J_|RECOMMEND_VIA_AGENT_GRAPH|KG_|APP_ENV|PROJECT_AGENT_)' Dockerfile; then
            echo "::error::Dockerfile bakes infra/app Haystack config (ENV/ARG). Use .env.prod, heavy-rental/haystack, or docker -e."
            exit 1
          fi
          if grep -Eiq '^[[:space:]]*COPY[[:space:]]+\.env' Dockerfile; then
            echo "::error::Dockerfile copies a raw .env / .env.prod. Release may only COPY haystack.prod.env .env after sanitizing."
            exit 1
          fi
          if ! grep -Eq '^COPY[[:space:]]+haystack\.prod\.env[[:space:]]+\.env$' Dockerfile; then
            echo "::error::Generated Dockerfile must COPY haystack.prod.env .env so pydantic loads the production profile."
            exit 1
          fi
          if grep -Eiq '^(POSTGRES_|SOURCE_|TARGET_|DATABASE_URL=|NEO4J_URI=|NEO4J_USER=|NEO4J_PASSWORD=|NEO4J_POPULATE_URL=|LLM_API_KEY=)' haystack.prod.env; then
            echo "::error::haystack.prod.env still contains estate/secret keys. Strip them before COPY."
            exit 1
          fi
          if ! grep -Eq '^APP_ENV=' haystack.prod.env; then
            echo "::error::haystack.prod.env must set APP_ENV (production profile)."
            exit 1
          fi
          if ! grep -Eq 'uvicorn.*app\.main:app' Dockerfile; then
            echo "::error::Generated Dockerfile must run uvicorn app.main:app."
            exit 1
          fi

      - name: Build Docker image
        id: docker
        working-directory: ${{ env.APP_PATH }}
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_LOCAL: ${{ steps.package.outputs.image_local }}
          IMAGE_LOCAL_LATEST: ${{ steps.package.outputs.image_local_latest }}
          IMAGE_REMOTE: ${{ steps.package.outputs.image_remote }}
          IMAGE_REMOTE_LATEST: ${{ steps.package.outputs.image_remote_latest }}
          IMAGE_TAR: ${{ steps.package.outputs.image_tar }}
        run: |
          set -euo pipefail
          IMAGE_NAME_LC="${IMAGE_NAME,,}"
          OWNER_LC="${GH_REPOSITORY_OWNER,,}"
          IMAGE_LOCAL="${IMAGE_LOCAL,,}"
          IMAGE_LOCAL_LATEST="${IMAGE_LOCAL_LATEST,,}"
          IMAGE_REMOTE="${IMAGE_REMOTE,,}"
          IMAGE_REMOTE_LATEST="${IMAGE_REMOTE_LATEST,,}"

          # No --build-arg for POSTGRES_ / SOURCE_ / TARGET_ / DATABASE_URL / LLM_ / INDEXING_ / NEO4J_ / FLEET_ / KG_
          docker build \
            --pull \
            -t "${IMAGE_LOCAL}" \
            -t "${IMAGE_LOCAL_LATEST}" \
            -t "${IMAGE_REMOTE}" \
            -t "${IMAGE_REMOTE_LATEST}" \
            .

          echo "==> Images built"
          echo "Local:  ${IMAGE_LOCAL}"
          echo "GHCR:   ${IMAGE_REMOTE}"
          docker images "${IMAGE_NAME_LC}" --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}'
          docker images "ghcr.io/${OWNER_LC}/${IMAGE_NAME_LC}" --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' || true

          # Use the stable IMAGE_ARCHIVE name so DAST/Publish can find it without job outputs.
          TAR_PATH="${GITHUB_WORKSPACE}/${IMAGE_ARCHIVE}"
          docker save \
            "${IMAGE_LOCAL}" \
            "${IMAGE_LOCAL_LATEST}" \
            "${IMAGE_REMOTE}" \
            "${IMAGE_REMOTE_LATEST}" \
            | gzip -c > "${TAR_PATH}"
          ls -lh "${TAR_PATH}"
          if [ ! -s "${TAR_PATH}" ]; then
            echo "::error::Docker image tar is missing or empty: ${TAR_PATH}"
            exit 1
          fi

          {
            echo "IMAGE_LOCAL=${IMAGE_LOCAL}"
            echo "IMAGE_LOCAL_LATEST=${IMAGE_LOCAL_LATEST}"
            echo "IMAGE_REMOTE=${IMAGE_REMOTE}"
            echo "IMAGE_REMOTE_LATEST=${IMAGE_REMOTE_LATEST}"
            echo "IMAGE_TAG=${IMAGE_LOCAL##*:}"
          } > "${GITHUB_WORKSPACE}/${IMAGE_META}"
          echo "==> ${IMAGE_META}"
          cat "${GITHUB_WORKSPACE}/${IMAGE_META}"

          {
            echo "image_id=$(docker image inspect -f '{{.Id}}' "${IMAGE_LOCAL}")"
            echo "tar_path=${TAR_PATH}"
          } >> "$GITHUB_OUTPUT"

      - name: Prove image is deployable
        env:
          IMAGE_LOCAL: ${{ steps.package.outputs.image_local }}
        run: |
          set -euo pipefail
          IMAGE_LOCAL="${IMAGE_LOCAL,,}"
          NAME="haystack-smoke-${GITHUB_RUN_ID:-$$}"

          ENV_JSON="$(docker image inspect -f '{{json .Config.Env}}' "${IMAGE_LOCAL}")"
          echo "Image Config.Env: ${ENV_JSON}"
          if printf '%s' "${ENV_JSON}" | grep -Eq '"POSTGRES_|"SOURCE_|"TARGET_|"DATABASE_URL=|"NEED_DECOMPOSER=|"LLM_|"INDEXING_|"IDEMPOTENCY_|"FLEET_BACKEND=|"PRICING_SCHEMA=|"NEO4J_|"RECOMMEND_VIA_AGENT_GRAPH=|"KG_'; then
            echo "::error::Image bakes infra/app Haystack env. Inject via heavy-rental/haystack or docker -e."
            exit 1
          fi

          EXPOSED="$(docker image inspect -f '{{json .Config.ExposedPorts}}' "${IMAGE_LOCAL}")"
          echo "Image ExposedPorts: ${EXPOSED}"
          if ! printf '%s' "${EXPOSED}" | grep -q '8000/tcp'; then
            echo "::error::Image does not EXPOSE 8000/tcp. docker run -p 8000:8000 and Academy compose require it."
            exit 1
          fi

          docker run --rm --entrypoint /bin/sh "${IMAGE_LOCAL}" -c 'test -f /app/app/main.py'
          echo "Image contains /app/app/main.py (uvicorn app.main:app)"

          docker run --rm --entrypoint /bin/sh "${IMAGE_LOCAL}" -c 'test -f /app/.env && grep -q "^APP_ENV=" /app/.env'
          echo "Image contains sanitized /app/.env (from .env.prod) for pydantic Settings."
          if docker run --rm --entrypoint /bin/sh "${IMAGE_LOCAL}" \
            -c 'grep -Eq "^(POSTGRES_|SOURCE_|TARGET_|DATABASE_URL=|NEO4J_URI=|NEO4J_PASSWORD=|LLM_API_KEY=)" /app/.env'; then
            echo "::error::Image /app/.env still has estate or secret keys."
            docker run --rm --entrypoint /bin/sh "${IMAGE_LOCAL}" -c 'cat /app/.env'
            exit 1
          fi
          PROFILE_ENV="$(
            docker run --rm --entrypoint /bin/sh "${IMAGE_LOCAL}" \
              -c 'uv run python -c "from app.config import Settings; print(Settings().app_env)"'
          )"
          echo "pydantic Settings().app_env=${PROFILE_ENV} (from /app/.env)"
          if [ -z "${PROFILE_ENV}" ]; then
            echo "::error::Settings() did not load APP_ENV from /app/.env."
            exit 1
          fi
          OVERRIDE_ENV="$(
            docker run --rm -e APP_ENV=ci-override --entrypoint /bin/sh "${IMAGE_LOCAL}" \
              -c 'uv run python -c "from app.config import Settings; print(Settings().app_env)"'
          )"
          echo "APP_ENV override via -e → Settings().app_env=${OVERRIDE_ENV}"
          echo "${OVERRIDE_ENV}" | grep -qx 'ci-override'
          echo "Process env still wins over /app/.env (compose SM / overlay / docker -e)."

          # Dummy values only — not Vocareum, not Academy RDS, not a real LLM.
          # Infra sync-secrets writes FLEET_BACKEND/NEO4J_*/LLM_API_KEY/DB; the rest
          # are optional SM extras from .env.example. All must be injectable.
          OUT="$(
            docker run --rm \
              -e SOURCE_HOST=sor.example.test \
              -e SOURCE_PORT=5432 \
              -e SOURCE_DATABASE=heavy_rental \
              -e TARGET_HOST=haystack.example.test \
              -e TARGET_PORT=5432 \
              -e TARGET_DATABASE=haystack \
              -e POSTGRES_USERNAME=ci_dummy \
              -e POSTGRES_PASSWORD=ci_dummy \
              -e DATABASE_URL=postgresql://ci_dummy:ci_dummy@haystack.example.test:5432/haystack \
              -e NEED_DECOMPOSER=stub \
              -e LLM_BASE_URL=https://llm.example.test/v1 \
              -e LLM_API_KEY=ci-dummy-llm-key \
              -e LLM_MODEL=ci-dummy-model \
              -e LLM_TIMEOUT_SECONDS=60 \
              -e LLM_TEMPERATURE=0.5 \
              -e INDEXING_EMBEDDER=mock \
              -e INDEXING_EMBEDDING_DIM=384 \
              -e INDEXING_SPLIT_LENGTH=200 \
              -e INDEXING_SPLIT_OVERLAP=20 \
              -e INDEXING_OPENAI_EMBEDDING_MODEL=text-embedding-3-small \
              -e INDEXING_DOCUMENT_STORE=memory \
              -e INDEXING_CHUNK_TTL_SECONDS=0 \
              -e IDEMPOTENCY_TTL_SECONDS=86400 \
              -e INDEXING_VIA_AGENT_GATE=false \
              -e FLEET_BACKEND=sql \
              -e PRICING_SCHEMA=primary_snapshot \
              -e NEO4J_BACKEND=bolt \
              -e NEO4J_URI=bolt://neo4j.example.test:7687 \
              -e NEO4J_USER=neo4j \
              -e NEO4J_PASSWORD=ci-dummy-neo4j \
              -e NEO4J_POPULATE_URL=http://neo4j-populate.example.test:8089/v1/populate \
              -e NEO4J_POPULATE_TIMEOUT_SECONDS=2 \
              -e RECOMMEND_VIA_AGENT_GRAPH=false \
              -e KG_ARTIFACT_DIR=artifacts/kg \
              -e KG_APPLY_TRANSFORMS=false \
              --entrypoint /bin/sh \
              "${IMAGE_LOCAL}" \
              -c 'printf "%s\n" \
                "$SOURCE_HOST" "$DATABASE_URL" \
                "$NEED_DECOMPOSER" "$LLM_BASE_URL" "$LLM_API_KEY" "$LLM_MODEL" \
                "$LLM_TIMEOUT_SECONDS" "$LLM_TEMPERATURE" \
                "$INDEXING_EMBEDDER" "$INDEXING_EMBEDDING_DIM" \
                "$INDEXING_SPLIT_LENGTH" "$INDEXING_SPLIT_OVERLAP" \
                "$INDEXING_OPENAI_EMBEDDING_MODEL" "$INDEXING_DOCUMENT_STORE" \
                "$INDEXING_CHUNK_TTL_SECONDS" "$IDEMPOTENCY_TTL_SECONDS" \
                "$INDEXING_VIA_AGENT_GATE" "$FLEET_BACKEND" "$PRICING_SCHEMA" \
                "$NEO4J_BACKEND" "$NEO4J_URI" "$NEO4J_USER" "$NEO4J_PASSWORD" \
                "$NEO4J_POPULATE_URL" "$NEO4J_POPULATE_TIMEOUT_SECONDS" \
                "$RECOMMEND_VIA_AGENT_GRAPH" "$KG_ARTIFACT_DIR" "$KG_APPLY_TRANSFORMS"'
          )"
          echo "${OUT}" | grep -qx 'sor.example.test'
          echo "${OUT}" | grep -qx 'postgresql://ci_dummy:ci_dummy@haystack.example.test:5432/haystack'
          echo "${OUT}" | grep -qx 'stub'
          echo "${OUT}" | grep -qx 'https://llm.example.test/v1'
          echo "${OUT}" | grep -qx 'ci-dummy-llm-key'
          echo "${OUT}" | grep -qx 'ci-dummy-model'
          echo "${OUT}" | grep -qx '60'
          echo "${OUT}" | grep -qx '0.5'
          echo "${OUT}" | grep -qx 'mock'
          echo "${OUT}" | grep -qx '384'
          echo "${OUT}" | grep -qx '200'
          echo "${OUT}" | grep -qx '20'
          echo "${OUT}" | grep -qx 'text-embedding-3-small'
          echo "${OUT}" | grep -qx 'memory'
          echo "${OUT}" | grep -qx '0'
          echo "${OUT}" | grep -qx '86400'
          echo "${OUT}" | grep -qx 'false'
          echo "${OUT}" | grep -qx 'sql'
          echo "${OUT}" | grep -qx 'primary_snapshot'
          echo "${OUT}" | grep -qx 'bolt'
          echo "${OUT}" | grep -qx 'bolt://neo4j.example.test:7687'
          echo "${OUT}" | grep -qx 'neo4j'
          echo "${OUT}" | grep -qx 'ci-dummy-neo4j'
          echo "${OUT}" | grep -qx 'http://neo4j-populate.example.test:8089/v1/populate'
          echo "${OUT}" | grep -qx '2'
          echo "${OUT}" | grep -qx 'artifacts/kg'
          echo "Dummy infra SM keys and .env.example knobs are visible at runtime (not baked)."

          SYNC_STATUS="absent"
          if docker run --rm --entrypoint /bin/sh "${IMAGE_LOCAL}" \
            -c 'uv run python -c "import postgres_haystack_sync"' >/tmp/sync-import.log 2>&1; then
            SYNC_STATUS="importable"
          else
            echo "::warning::postgres_haystack_sync is not importable in this image (app checkout may not ship the package)."
            cat /tmp/sync-import.log || true
          fi

          cleanup() { docker rm -f "${NAME}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          # CI-safe Profile A flags at run time only — not baked into the image.
          docker run -d --name "${NAME}" \
            -e SOURCE_HOST=sor.example.test \
            -e SOURCE_PORT=5432 \
            -e SOURCE_DATABASE=heavy_rental \
            -e TARGET_HOST=haystack.example.test \
            -e TARGET_PORT=5432 \
            -e TARGET_DATABASE=haystack \
            -e POSTGRES_USERNAME=ci_dummy \
            -e POSTGRES_PASSWORD=ci_dummy \
            -e DATABASE_URL=postgresql://ci_dummy:ci_dummy@haystack.example.test:5432/haystack \
            -e NEED_DECOMPOSER=stub \
            -e INDEXING_EMBEDDER=mock \
            -e INDEXING_DOCUMENT_STORE=memory \
            -e FLEET_BACKEND=fake \
            -e NEO4J_BACKEND=fake \
            -e RECOMMEND_VIA_AGENT_GRAPH=false \
            -e KG_APPLY_TRANSFORMS=false \
            "${IMAGE_LOCAL}"

          http_code() {
            local path="$1"
            local py code
            py="$(printf '%s\n' \
              'import urllib.request, urllib.error' \
              "p = '${path}'" \
              'try:' \
              '    r = urllib.request.urlopen("http://127.0.0.1:8000" + p, timeout=3)' \
              '    print(r.status)' \
              'except urllib.error.HTTPError as e:' \
              '    print(e.code)' \
              'except Exception:' \
              '    print(0)')"
            code="$(docker exec "${NAME}" python3 -c "${py}" 2>/dev/null | tr -cd '0-9')"
            echo "${code:-0}"
          }

          docs=0
          health=0
          for _ in $(seq 1 90); do
            docs="$(http_code /docs)"
            health="$(http_code /health)"
            if { [ "${docs}" -ge 200 ] && [ "${docs}" -le 302 ]; } \
              || { [ "${health}" -ge 200 ] && [ "${health}" -le 302 ]; }; then
              break
            fi
            sleep 1
          done

          echo "GET /docs=${docs} GET /health=${health}"
          if ! { [ "${docs}" -ge 200 ] && [ "${docs}" -le 302 ]; } \
            && ! { [ "${health}" -ge 200 ] && [ "${health}" -le 302 ]; }; then
            echo "::error::uvicorn did not serve GET /docs or GET /health on :8000 (image is not deployable)."
            docker logs "${NAME}" || true
            exit 1
          fi
          if [ "${docs}" -ge 200 ] && [ "${docs}" -le 302 ]; then
            echo "GET /docs returned ${docs}"
          else
            echo "::warning::GET /docs returned ${docs}; /health was accepted."
          fi
          if [ "${health}" -ge 200 ] && [ "${health}" -le 302 ]; then
            echo "GET /health returned ${health} (degraded is OK without Postgres)"
          else
            echo "::warning::GET /health returned ${health}; /docs was accepted."
          fi
          echo "Haystack FastAPI endpoints are reachable; image is deployable on any Docker Engine."

          {
            echo "### Deployable image"
            echo ""
            echo "Generated \`python:3.12-slim-bookworm\` + uv + \`uvicorn app.main:app --host 0.0.0.0 --port 8000\`."
            echo "No baked POSTGRES_/SOURCE_/TARGET_/DATABASE_URL/NEED_DECOMPOSER/LLM_/INDEXING_/NEO4J_/FLEET_/KG_ in Config.Env."
            echo "Product knobs from sanitized \`.env.prod\` live in \`/app/.env\` (pydantic). Process env still wins."
            echo "Infra \`heavy-rental/haystack\` injects estate keys at runtime. \`Settings().app_env\` loaded from the file."
            echo "Dummy compose-style env is visible. \`EXPOSE 8000\`."
            echo "Started uvicorn and reached \`GET /docs\` (${docs}) and \`GET /health\` (${health}); container was removed."
            echo "Run anywhere: \`docker run -p 8000:8000 -e DATABASE_URL=… <image>\` (Docker Desktop, compose, or Academy)."
            echo "postgres_haystack_sync: \`${SYNC_STATUS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Docker image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: haystack-fast-api-release-docker-image
          path: |
            ${{ github.workspace }}/${{ env.IMAGE_ARCHIVE }}
            ${{ github.workspace }}/${{ env.IMAGE_META }}
          retention-days: 14
          if-no-files-found: error

      - name: Packaging summary
        env:
          IMAGE_LOCAL: ${{ steps.package.outputs.image_local }}
          IMAGE_REMOTE: ${{ steps.package.outputs.image_remote }}
          IMAGE_REMOTE_LATEST: ${{ steps.package.outputs.image_remote_latest }}
          IMAGE_TAR: ${{ steps.package.outputs.image_tar }}
          IMAGE_ID: ${{ steps.docker.outputs.image_id }}
        run: |
          set -euo pipefail
          {
            echo "### Deploy options"
            echo ""
            echo "1. **Wheel / sdist** — download \`haystack-fast-api-release-packages\`."
            echo "2. **Image archive** — \`gzip -dc ${IMAGE_ARCHIVE} | docker load\` then \`docker run -p 8000:8000 -e … ${IMAGE_LOCAL}\` (id \`${IMAGE_ID}\`)."
            echo "3. **GHCR** — Publish (after DAST) pushes \`${IMAGE_REMOTE}\` and \`${IMAGE_REMOTE_LATEST}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  dast:
    name: DAST
    runs-on: ubuntu-latest
    needs: [packaging]
    timeout-minutes: 40
    steps:
      - name: Download Docker image archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: haystack-fast-api-release-docker-image
          path: ${{ github.workspace }}

      - name: Load image and start target
        id: start-dast
        run: |
          set -euo pipefail
          # Stable IMAGE_ARCHIVE/IMAGE_META so DAST/Publish do not depend on job outputs.
          META="${GITHUB_WORKSPACE}/${IMAGE_META}"
          ARCHIVE="${GITHUB_WORKSPACE}/${IMAGE_ARCHIVE}"
          if [ -f "${META}" ]; then
            set -a
            # shellcheck disable=SC1090
            . "${META}"
            set +a
          fi
          if [ ! -f "${ARCHIVE}" ]; then
            ARCHIVE="$(find "${GITHUB_WORKSPACE}" -maxdepth 2 -type f -name '*.tar.gz' | head -n 1 || true)"
          fi
          if [ -z "${ARCHIVE}" ] || [ ! -f "${ARCHIVE}" ]; then
            echo "::error::Docker image archive not found after downloading haystack-fast-api-release-docker-image."
            echo "Expected ${GITHUB_WORKSPACE}/${IMAGE_ARCHIVE} (and ${IMAGE_META})."
            ls -la "${GITHUB_WORKSPACE}" || true
            find "${GITHUB_WORKSPACE}" -maxdepth 2 -type f | head -n 50 || true
            exit 1
          fi
          echo "Loading ${ARCHIVE} ($(wc -c < "${ARCHIVE}") bytes)"
          gzip -dc "${ARCHIVE}" | docker load
          docker images
          if [ -z "${IMAGE_LOCAL:-}" ]; then
            IMAGE_LOCAL="$(docker images --format '{{.Repository}}:{{.Tag}}' "${IMAGE_NAME}" \
              | grep -vE ':(latest|<none>)$' | head -n 1 || true)"
          fi
          if [ -z "${IMAGE_LOCAL:-}" ]; then
            echo "::error::Could not determine IMAGE_LOCAL after docker load. ${IMAGE_META} missing?"
            exit 1
          fi
          IMAGE_LOCAL="${IMAGE_LOCAL,,}"
          echo "Using IMAGE_LOCAL=${IMAGE_LOCAL}"

          docker network inspect dastnet >/dev/null 2>&1 || docker network create dastnet
          docker rm -f dast-app >/dev/null 2>&1 || true
          docker run -d --name dast-app --network dastnet --network-alias dast-app \
            -p 8000:8000 \
            -e SOURCE_HOST=sor.example.test \
            -e SOURCE_PORT=5432 \
            -e SOURCE_DATABASE=heavy_rental \
            -e TARGET_HOST=haystack.example.test \
            -e TARGET_PORT=5432 \
            -e TARGET_DATABASE=haystack \
            -e POSTGRES_USERNAME=ci_dummy \
            -e POSTGRES_PASSWORD=ci_dummy \
            -e DATABASE_URL=postgresql://ci_dummy:ci_dummy@haystack.example.test:5432/haystack \
            -e NEED_DECOMPOSER=stub \
            -e INDEXING_EMBEDDER=mock \
            -e INDEXING_DOCUMENT_STORE=memory \
            -e FLEET_BACKEND=fake \
            -e NEO4J_BACKEND=fake \
            -e RECOMMEND_VIA_AGENT_GRAPH=false \
            -e KG_APPLY_TRANSFORMS=false \
            "${IMAGE_LOCAL}"
          ok=0
          for _ in $(seq 1 60); do
            if curl -sS -o /dev/null --max-time 3 "http://127.0.0.1:8000/" \
              || curl -sS -o /dev/null --max-time 3 "http://127.0.0.1:8000/docs" \
              || curl -sS -o /dev/null --max-time 3 "http://127.0.0.1:8000/health"; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::DAST target did not become ready on :8000."
            docker logs dast-app || true
            exit 1
          fi
          echo "DAST target is up at http://dast-app:8000 (also http://127.0.0.1:8000)"

      - name: Prepare DAST reports directory
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/dast-reports"
          chmod 777 "${GITHUB_WORKSPACE}/dast-reports"

      - name: OWASP ZAP baseline
        if: ${{ always() && steps.start-dast.outcome == 'success' }}
        run: |
          set -euo pipefail
          REPORTS="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORTS}"
          chmod 777 "${REPORTS}"
          set +e
          docker run --rm --network dastnet \
            -v "${REPORTS}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "http://dast-app:8000" -J zap.json -r zap.html -w zap.md -I
          ZAP_RC=$?
          set -e
          echo "ZAP exit=${ZAP_RC} (0=pass, 1=warn, 2=fail)"
          ls -la "${REPORTS}" || true
          for f in zap.json zap.html zap.md; do
            if [ ! -s "${REPORTS}/${f}" ]; then
              echo "ZAP did not write ${f} (exit=${ZAP_RC})" > "${REPORTS}/${f}"
            fi
          done
          if [ "${ZAP_RC}" -ge 2 ]; then
            echo "::error::OWASP ZAP baseline failed (high-severity findings or scan error)."
            exit "${ZAP_RC}"
          fi

      - name: Dastardly
        if: ${{ always() && steps.start-dast.outcome == 'success' }}
        run: |
          set -euo pipefail
          REPORTS="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORTS}"
          chmod 777 "${REPORTS}"
          set +e
          docker run --rm --network dastnet \
            -v "${REPORTS}:/dastardly" \
            -e DASTARDLY_TARGET_URL="http://dast-app:8000" \
            -e DASTARDLY_OUTPUT_FILE=/dastardly/dastardly-report.xml \
            public.ecr.aws/portswigger/dastardly:latest
          DAST_RC=$?
          set -e
          echo "Dastardly exit=${DAST_RC}"
          ls -la "${REPORTS}" || true
          if [ ! -s "${REPORTS}/dastardly-report.xml" ]; then
            printf '%s\n' '<testsuites name="dastardly"/>' > "${REPORTS}/dastardly-report.xml"
          fi
          if [ "${DAST_RC}" -ne 0 ]; then
            echo "::error::Dastardly reported high-severity findings (or the scan failed)."
            exit "${DAST_RC}"
          fi

      - name: Nuclei (report-only)
        if: ${{ always() && steps.start-dast.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          REPORTS="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORTS}"
          chmod 777 "${REPORTS}"
          docker run --rm --network dastnet \
            -v "${REPORTS}:/out" \
            projectdiscovery/nuclei:latest \
            -u "http://dast-app:8000" -silent -jsonl -o /out/nuclei.jsonl || true
          if [ ! -f "${REPORTS}/nuclei.jsonl" ]; then
            touch "${REPORTS}/nuclei.jsonl"
          fi

      # Combined human-readable DAST PDF. Keep in sync with
      # heavy-rental-project-pipeline-development/scripts/combine-dast-report.py
      # Download: Summary → Artifacts (`dast-combined-report-pdf`), job summary link,
      # or the GitHub Release asset.
      - name: Install reportlab (combined DAST PDF)
        if: always()
        run: pip install --quiet reportlab

      - name: Combine DAST reports into PDF
        if: always()
        env:
          COMBINED_PDF_TITLE: Heavy Rental Haystack FastAPI — Combined DAST report
        run: |
          set -euo pipefail
          REPORT_DIR="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORT_DIR}"
          cat > "${REPORT_DIR}/combine-dast-report.py" << 'COMBINE_DAST_REPORT_PY'
          #!/usr/bin/env python3
          """Combine Release DAST tool outputs into one PDF.
          
          Keep this file in sync with the heredoc in each Release CI
          ``release-pipeline.yml`` DAST job.
          
          Supported inputs (all optional):
            - zap.json (OWASP ZAP baseline)
            - dastardly-report.xml (Dastardly JUnit XML)
            - nuclei.jsonl (Nuclei)
            - mobsf-report.json (MobSF)
          
          Request bodies, ZAP evidence, and SARIF-style snippets are never copied
          into the PDF (scanner hits can echo credentials).
          """
          
          from __future__ import annotations
          
          import argparse
          import json
          import re
          import sys
          from collections import Counter
          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from pathlib import Path
          from xml.etree import ElementTree
          from xml.sax.saxutils import escape as xml_escape
          
          from reportlab.lib import colors
          from reportlab.lib.pagesizes import letter
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import inch
          from reportlab.platypus import (
              PageBreak,
              Paragraph,
              SimpleDocTemplate,
              Spacer,
              Table,
              TableStyle,
          )
          
          MAX_MESSAGE = 400
          MAX_FINDINGS_PER_TOOL = 200
          SKIP_NAMES = {
              "combined-dast-report.pdf",
              "combine-dast-report.py",
              "INDEX.md",
              "zap.html",
              "zap.md",
              "mobsf-upload.json",
              "mobsf-scan.json",
              "mobsf-report.pdf",
          }
          HTML_TAG_RE = re.compile(r"<[^>]+>")
          ZAP_RISK = {"0": "info", "1": "low", "2": "medium", "3": "high", "4": "critical"}
          
          
          @dataclass
          class Finding:
              rule_id: str
              level: str
              location: str
              message: str
          
          
          @dataclass
          class ToolReport:
              name: str
              source_file: str
              present: bool
              findings: list[Finding] = field(default_factory=list)
              note: str = ""
          
          
          def pdf_safe(text: str) -> str:
              raw = "" if text is None else str(text)
              raw = raw.replace("\r\n", "\n").replace("\r", "\n")
              raw = raw.encode("latin-1", "replace").decode("latin-1")
              return xml_escape(raw)
          
          
          def truncate(text: str, limit: int = MAX_MESSAGE) -> str:
              text = " ".join((text or "").split())
              if len(text) <= limit:
                  return text
              return text[: limit - 1] + "…"
          
          
          def strip_html(text: str) -> str:
              return HTML_TAG_RE.sub(" ", text or "")
          
          
          def _unreadable(path: Path, name: str, exc: Exception) -> ToolReport:
              return ToolReport(
                  name=name,
                  source_file=path.name,
                  present=True,
                  note=f"Could not parse {path.name}: {exc}",
              )
          
          
          def _placeholder_note(path: Path, prefix: str) -> str | None:
              try:
                  text = path.read_text(encoding="utf-8", errors="replace")
              except OSError:
                  return None
              stripped = text.strip()
              if stripped.startswith(prefix) or stripped.startswith("ZAP did not write"):
                  return truncate(stripped, 200)
              return None
          
          
          def parse_zap(path: Path) -> ToolReport:
              note = _placeholder_note(path, "ZAP did not write")
              if note:
                  return ToolReport(name="OWASP ZAP", source_file=path.name, present=True, note=note)
              try:
                  data = json.loads(path.read_text(encoding="utf-8") or "{}")
              except (OSError, json.JSONDecodeError) as exc:
                  return _unreadable(path, "OWASP ZAP", exc)
              if not isinstance(data, dict):
                  return ToolReport(
                      name="OWASP ZAP",
                      source_file=path.name,
                      present=True,
                      note="ZAP JSON was not an object.",
                  )
              findings: list[Finding] = []
              for site in data.get("site") or []:
                  if not isinstance(site, dict):
                      continue
                  site_name = site.get("@name") or site.get("name") or ""
                  for alert in site.get("alerts") or []:
                      if not isinstance(alert, dict):
                          continue
                      riskcode = str(alert.get("riskcode") or "")
                      level = (alert.get("riskdesc") or ZAP_RISK.get(riskcode) or "warning").split()[0].lower()
                      name = alert.get("alert") or alert.get("name") or "alert"
                      instances = alert.get("instances") or []
                      uri = site_name or "—"
                      if instances and isinstance(instances[0], dict):
                          uri = instances[0].get("uri") or uri
                      desc = truncate(strip_html(str(alert.get("desc") or "")))
                      findings.append(
                          Finding(
                              rule_id=str(alert.get("pluginid") or alert.get("alertRef") or name),
                              level=level or "warning",
                              location=str(uri),
                              message=desc or truncate(str(name)),
                          )
                      )
              return ToolReport(name="OWASP ZAP", source_file=path.name, present=True, findings=findings)
          
          
          def parse_dastardly(path: Path) -> ToolReport:
              try:
                  text = path.read_text(encoding="utf-8")
              except OSError as exc:
                  return _unreadable(path, "Dastardly", exc)
              stripped = text.strip()
              if stripped in {"<testsuites name=\"dastardly\"/>", "<testsuites name='dastardly'/>"}:
                  return ToolReport(
                      name="Dastardly",
                      source_file=path.name,
                      present=True,
                      note="Placeholder empty Dastardly report (scanner did not write XML).",
                  )
              try:
                  root = ElementTree.fromstring(text)
              except ElementTree.ParseError as exc:
                  return _unreadable(path, "Dastardly", exc)
              findings: list[Finding] = []
              for case in root.iter("testcase"):
                  name = case.get("name") or case.get("classname") or "testcase"
                  location = case.get("classname") or "—"
                  for child in list(case):
                      tag = child.tag.split("}", 1)[-1]
                      if tag not in {"failure", "error"}:
                          continue
                      msg = child.get("message") or ""
                      findings.append(
                          Finding(
                              rule_id=str(name),
                              level="high" if tag == "failure" else "error",
                              location=str(location),
                              message=truncate(msg or (child.text or tag)),
                          )
                      )
              return ToolReport(name="Dastardly", source_file=path.name, present=True, findings=findings)
          
          
          def parse_nuclei(path: Path) -> ToolReport:
              try:
                  text = path.read_text(encoding="utf-8")
              except OSError as exc:
                  return _unreadable(path, "Nuclei", exc)
              findings: list[Finding] = []
              notes: list[str] = []
              for line_no, raw in enumerate(text.splitlines(), start=1):
                  line = raw.strip()
                  if not line:
                      continue
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError as exc:
                      notes.append(f"line {line_no}: {exc}")
                      continue
                  if not isinstance(row, dict):
                      continue
                  info = row.get("info") if isinstance(row.get("info"), dict) else {}
                  name = info.get("name") or row.get("template-id") or row.get("template_id") or "nuclei"
                  level = str(info.get("severity") or "info").lower()
                  location = str(row.get("matched-at") or row.get("matched_at") or row.get("host") or "—")
                  desc = info.get("description") or name
                  findings.append(
                      Finding(
                          rule_id=str(row.get("template-id") or row.get("template_id") or name),
                          level=level,
                          location=location,
                          message=truncate(str(desc)),
                      )
                  )
              note = ""
              if notes:
                  note = truncate("; ".join(notes[:5]))
              return ToolReport(
                  name="Nuclei",
                  source_file=path.name,
                  present=True,
                  findings=findings,
                  note=note,
              )
          
          
          def _mobsf_finding(rule_id: str, level: str, location: str, message: str) -> Finding:
              return Finding(
                  rule_id=truncate(str(rule_id), 80),
                  level=(level or "warning").lower(),
                  location=truncate(str(location or "—"), 120),
                  message=truncate(str(message)),
              )
          
          
          def _walk_mobsf_list(items: object, default_level: str, location: str) -> list[Finding]:
              findings: list[Finding] = []
              if not isinstance(items, list):
                  return findings
              for item in items:
                  if isinstance(item, str):
                      findings.append(_mobsf_finding(item, default_level, location, item))
                  elif isinstance(item, (list, tuple)) and item:
                      level = default_level
                      msg = item[-1] if len(item) > 1 else item[0]
                      if len(item) >= 2 and isinstance(item[0], str):
                          level = str(item[0])
                      rule = item[1] if len(item) > 1 else item[0]
                      findings.append(_mobsf_finding(str(rule), level, location, str(msg)))
                  elif isinstance(item, dict):
                      level = str(
                          item.get("severity")
                          or item.get("level")
                          or item.get("stat")
                          or default_level
                      )
                      title = item.get("title") or item.get("rule") or item.get("name") or "finding"
                      desc = item.get("description") or item.get("desc") or title
                      loc = item.get("file") or item.get("path") or location
                      findings.append(_mobsf_finding(str(title), level, str(loc), str(desc)))
              return findings
          
          
          def parse_mobsf(path: Path) -> ToolReport:
              try:
                  data = json.loads(path.read_text(encoding="utf-8") or "{}")
              except (OSError, json.JSONDecodeError) as exc:
                  return _unreadable(path, "MobSF", exc)
              if not isinstance(data, dict):
                  return ToolReport(
                      name="MobSF",
                      source_file=path.name,
                      present=True,
                      note="MobSF JSON was not an object.",
                  )
              if data.get("error") and len(data) <= 2:
                  return ToolReport(
                      name="MobSF",
                      source_file=path.name,
                      present=True,
                      note=truncate(str(data.get("error"))),
                  )
              findings: list[Finding] = []
              for key, level in (("high", "high"), ("warning", "warning"), ("info", "info")):
                  findings.extend(_walk_mobsf_list(data.get(key), level, key))
              cert = data.get("certificate_analysis")
              if isinstance(cert, dict):
                  findings.extend(
                      _walk_mobsf_list(cert.get("certificate_findings"), "warning", "certificate")
                  )
              manifest = data.get("manifest_analysis")
              if isinstance(manifest, dict):
                  findings.extend(
                      _walk_mobsf_list(manifest.get("manifest_findings"), "warning", "manifest")
                  )
              network = data.get("network_security")
              if isinstance(network, dict):
                  findings.extend(
                      _walk_mobsf_list(network.get("network_findings"), "warning", "network")
                  )
              code = data.get("code_analysis")
              if isinstance(code, dict):
                  code_findings = code.get("findings")
                  if isinstance(code_findings, dict):
                      for rule_id, body in code_findings.items():
                          if not isinstance(body, dict):
                              continue
                          meta = body.get("metadata") if isinstance(body.get("metadata"), dict) else {}
                          level = str(meta.get("severity") or "info")
                          desc = meta.get("description") or rule_id
                          files = body.get("files")
                          loc = "code"
                          if isinstance(files, dict) and files:
                              loc = next(iter(files))
                          findings.append(_mobsf_finding(str(rule_id), level, str(loc), str(desc)))
              return ToolReport(name="MobSF", source_file=path.name, present=True, findings=findings)
          
          
          PARSERS = {
              "zap.json": parse_zap,
              "dastardly-report.xml": parse_dastardly,
              "nuclei.jsonl": parse_nuclei,
              "mobsf-report.json": parse_mobsf,
          }
          
          
          def collect_reports(input_dir: Path) -> list[ToolReport]:
              reports: list[ToolReport] = []
              if not input_dir.is_dir():
                  return reports
              for filename, parser in PARSERS.items():
                  path = input_dir / filename
                  if path.is_file():
                      reports.append(parser(path))
              return reports
          
          
          def level_counts(findings: list[Finding]) -> str:
              counts = Counter(f.level for f in findings)
              if not findings:
                  return "0"
              order = ["critical", "high", "medium", "low", "error", "warning", "info", "note", "none"]
              parts = [f"{lvl}={counts[lvl]}" for lvl in order if counts.get(lvl)]
              extra = sorted(k for k in counts if k not in order)
              parts.extend(f"{lvl}={counts[lvl]}" for lvl in extra)
              return f"{len(findings)} ({', '.join(parts)})"
          
          
          def _styles() -> dict:
              styles = getSampleStyleSheet()
              styles.add(
                  ParagraphStyle(
                      name="Meta",
                      parent=styles["Normal"],
                      fontName="Helvetica",
                      fontSize=9,
                      leading=12,
                      textColor=colors.HexColor("#333333"),
                  )
              )
              styles.add(
                  ParagraphStyle(
                      name="Cell",
                      parent=styles["Normal"],
                      fontName="Helvetica",
                      fontSize=8,
                      leading=10,
                  )
              )
              styles.add(
                  ParagraphStyle(
                      name="CellHead",
                      parent=styles["Normal"],
                      fontName="Helvetica-Bold",
                      fontSize=8,
                      leading=10,
                  )
              )
              return styles
          
          
          def _table(rows: list[list], col_widths: list[float]) -> Table:
              table = Table(rows, colWidths=col_widths, repeatRows=1)
              table.setStyle(
                  TableStyle(
                      [
                          ("GRID", (0, 0), (-1, -1), 0.4, colors.grey),
                          ("BACKGROUND", (0, 0), (-1, 0), colors.HexColor("#e8eef4")),
                          ("VALIGN", (0, 0), (-1, -1), "TOP"),
                          ("LEFTPADDING", (0, 0), (-1, -1), 4),
                          ("RIGHTPADDING", (0, 0), (-1, -1), 4),
                          ("TOPPADDING", (0, 0), (-1, -1), 3),
                          ("BOTTOMPADDING", (0, 0), (-1, -1), 3),
                      ]
                  )
              )
              return table
          
          
          def build_story(reports: list[ToolReport], args: argparse.Namespace) -> list:
              styles = _styles()
              cell, head = styles["Cell"], styles["CellHead"]
              story: list = [
                  Paragraph(pdf_safe(args.title), styles["Title"]),
                  Spacer(1, 8),
                  Paragraph(f"<b>Repository:</b> {pdf_safe(args.repo)}", styles["Meta"]),
                  Paragraph(f"<b>Commit:</b> {pdf_safe(args.sha)}", styles["Meta"]),
                  Paragraph(f"<b>Workflow run:</b> {pdf_safe(args.run_url)}", styles["Meta"]),
                  Paragraph(
                      f"<b>Generated (UTC):</b> {pdf_safe(datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%SZ'))}",
                      styles["Meta"],
                  ),
                  Paragraph(
                      "Machine-readable DAST outputs remain in this artifact (ZAP JSON/HTML, "
                      "Dastardly XML, Nuclei JSONL, MobSF JSON). This PDF is a human download. "
                      "Request bodies and scanner evidence snippets are omitted.",
                      styles["Meta"],
                  ),
                  Spacer(1, 14),
                  Paragraph("Summary", styles["Heading1"]),
              ]
              usable = 7.5 * inch
              if not reports:
                  story.append(Paragraph("No DAST scanner outputs were produced in dast-reports/.", styles["Normal"]))
                  return story
          
              summary_rows = [[
                  Paragraph("Tool", head),
                  Paragraph("File", head),
                  Paragraph("Present", head),
                  Paragraph("Findings", head),
              ]]
              for report in reports:
                  summary_rows.append([
                      Paragraph(pdf_safe(report.name), cell),
                      Paragraph(pdf_safe(report.source_file), cell),
                      Paragraph("yes" if report.present else "no", cell),
                      Paragraph(pdf_safe(level_counts(report.findings)), cell),
                  ])
              story.append(_table(summary_rows, [1.6 * inch, 2.0 * inch, 0.8 * inch, usable - 4.4 * inch]))
              story.append(Spacer(1, 12))
          
              for index, report in enumerate(reports):
                  if index:
                      story.append(PageBreak())
                  story.append(Paragraph(pdf_safe(f"{report.name} ({report.source_file})"), styles["Heading1"]))
                  if report.note:
                      story.append(Paragraph(pdf_safe(report.note), styles["Normal"]))
                  if not report.findings:
                      story.append(Paragraph("No findings in this report.", styles["Normal"]))
                      continue
                  shown = report.findings[:MAX_FINDINGS_PER_TOOL]
                  omitted = len(report.findings) - len(shown)
                  rows = [[
                      Paragraph("Level", head),
                      Paragraph("Rule", head),
                      Paragraph("Location", head),
                      Paragraph("Message", head),
                  ]]
                  for finding in shown:
                      rows.append([
                          Paragraph(pdf_safe(finding.level), cell),
                          Paragraph(pdf_safe(finding.rule_id), cell),
                          Paragraph(pdf_safe(finding.location), cell),
                          Paragraph(pdf_safe(finding.message).replace("\n", "<br/>"), cell),
                      ])
                  story.append(
                      _table(rows, [0.8 * inch, 1.6 * inch, 2.0 * inch, usable - 4.4 * inch])
                  )
                  if omitted > 0:
                      story.append(Spacer(1, 6))
                      story.append(
                          Paragraph(pdf_safe(f"… and {omitted} more finding(s) not listed."), styles["Meta"])
                      )
              return story
          
          
          def add_page_number(canvas, doc) -> None:
              canvas.saveState()
              canvas.setFont("Helvetica", 8)
              canvas.setFillColor(colors.HexColor("#555555"))
              canvas.drawString(0.75 * inch, 0.45 * inch, "Combined DAST report")
              canvas.drawRightString(letter[0] - 0.75 * inch, 0.45 * inch, f"Page {doc.page}")
              canvas.restoreState()
          
          
          def write_pdf(reports: list[ToolReport], args: argparse.Namespace) -> None:
              output = Path(args.output)
              output.parent.mkdir(parents=True, exist_ok=True)
              doc = SimpleDocTemplate(
                  str(output),
                  pagesize=letter,
                  leftMargin=0.75 * inch,
                  rightMargin=0.75 * inch,
                  topMargin=0.7 * inch,
                  bottomMargin=0.7 * inch,
                  title=args.title,
                  author="Heavy Rental Release CI",
              )
              doc.build(build_story(reports, args), onFirstPage=add_page_number, onLaterPages=add_page_number)
          
          
          def parse_args(argv: list[str] | None = None) -> argparse.Namespace:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--input-dir", required=True)
              parser.add_argument("--output", required=True)
              parser.add_argument("--title", default="Combined DAST report")
              parser.add_argument("--repo", default="")
              parser.add_argument("--sha", default="")
              parser.add_argument("--run-url", default="")
              return parser.parse_args(argv)
          
          
          def main(argv: list[str] | None = None) -> int:
              args = parse_args(argv)
              reports = collect_reports(Path(args.input_dir))
              write_pdf(reports, args)
              output = Path(args.output)
              if not output.is_file() or output.stat().st_size == 0:
                  print(f"error: PDF was not written: {output}", file=sys.stderr)
                  return 1
              print(f"Wrote {output} ({output.stat().st_size} bytes, {len(reports)} report(s))")
              return 0
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          COMBINE_DAST_REPORT_PY
          python3 "${REPORT_DIR}/combine-dast-report.py" \
            --input-dir "${REPORT_DIR}" \
            --output "${REPORT_DIR}/combined-dast-report.pdf" \
            --title "${COMBINED_PDF_TITLE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test -s "${REPORT_DIR}/combined-dast-report.pdf"

      - name: Upload combined DAST report (PDF)
        if: always() && hashFiles('dast-reports/combined-dast-report.pdf') != ''
        id: upload-dast-pdf
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dast-combined-report-pdf
          path: dast-reports/combined-dast-report.pdf
          retention-days: 30
          if-no-files-found: warn

      - name: Publish DAST PDF download
        if: always() && steps.upload-dast-pdf.outputs.artifact-url != ''
        env:
          PDF_URL: ${{ steps.upload-dast-pdf.outputs.artifact-url }}
        run: |
          {
            echo "### Combined DAST report (PDF)"
            echo ""
            echo "Download: [combined-dast-report.pdf](${PDF_URL})"
            echo ""
            echo "Artifact: \`dast-combined-report-pdf\` (also inside the DAST reports artifact)."
            echo "On this run: Summary → Artifacts. Also attached to the GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Index DAST reports
        if: always()
        run: |
          set -euo pipefail
          REPORTS="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORTS}"
          {
            echo "# DAST reports"
            echo ""
            echo "| File | Bytes |"
            echo "| --- | --- |"
            find "${REPORTS}" -maxdepth 1 -type f ! -name INDEX.md -print | sort | while read -r f; do
              echo "| \`$(basename "$f")\` | $(wc -c < "$f") |"
            done
          } | tee "${REPORTS}/INDEX.md"
          cat "${REPORTS}/INDEX.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop DAST target
        if: always()
        run: |
          docker rm -f dast-app >/dev/null 2>&1 || true
          docker network rm dastnet >/dev/null 2>&1 || true

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: haystack-fast-api-release-dast
          path: ${{ github.workspace }}/dast-reports/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [integration, packaging, dast]
    timeout-minutes: 20
    steps:
      - name: Download Docker image archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: haystack-fast-api-release-docker-image
          path: ${{ github.workspace }}

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: haystack-fast-api-release-packages
          path: ${{ github.workspace }}/release-package

      - name: Download DAST reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: haystack-fast-api-release-dast
          path: ${{ github.workspace }}/release-dast

      - name: Load image
        run: |
          set -euo pipefail
          META="${GITHUB_WORKSPACE}/${IMAGE_META}"
          ARCHIVE="${GITHUB_WORKSPACE}/${IMAGE_ARCHIVE}"
          if [ -f "${META}" ]; then
            set -a
            # shellcheck disable=SC1090
            . "${META}"
            set +a
          fi
          if [ ! -f "${ARCHIVE}" ]; then
            ARCHIVE="$(find "${GITHUB_WORKSPACE}" -maxdepth 2 -type f -name '*.tar.gz' | head -n 1 || true)"
          fi
          if [ -z "${ARCHIVE}" ] || [ ! -f "${ARCHIVE}" ]; then
            echo "::error::Docker image archive not found after downloading haystack-fast-api-release-docker-image."
            ls -la "${GITHUB_WORKSPACE}" || true
            exit 1
          fi
          echo "Loading ${ARCHIVE} ($(wc -c < "${ARCHIVE}") bytes)"
          gzip -dc "${ARCHIVE}" | docker load
          docker images

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR and set public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          META="${GITHUB_WORKSPACE}/${IMAGE_META}"
          if [ -f "${META}" ]; then
            set -a
            # shellcheck disable=SC1090
            . "${META}"
            set +a
          fi
          if [ -z "${IMAGE_REMOTE:-}" ] || [ -z "${IMAGE_REMOTE_LATEST:-}" ] || [ -z "${IMAGE_TAG:-}" ]; then
            echo "::error::IMAGE_REMOTE/IMAGE_TAG missing. Expected ${IMAGE_META} in haystack-fast-api-release-docker-image."
            cat "${META}" || true
            exit 1
          fi
          IMAGE_REMOTE="${IMAGE_REMOTE,,}"
          IMAGE_REMOTE_LATEST="${IMAGE_REMOTE_LATEST,,}"
          OWNER="${GH_REPOSITORY_OWNER}"
          PKG="${IMAGE_NAME,,}"

          list_tags() {
            local path="$1"
            gh api --paginate "${path}" --jq '.[] | .metadata.container.tags[]?' 2>/dev/null || true
          }

          TAGS="$(list_tags "/orgs/${OWNER}/packages/container/${PKG}/versions")"
          if [ -z "${TAGS}" ]; then
            TAGS="$(list_tags "/users/${OWNER}/packages/container/${PKG}/versions")"
          fi
          if printf '%s\n' "${TAGS}" | grep -qx "${IMAGE_TAG}"; then
            echo "::error::GHCR tag ${IMAGE_REMOTE} already exists; will not overwrite a version tag."
            exit 1
          fi

          docker push "${IMAGE_REMOTE}"
          docker push "${IMAGE_REMOTE_LATEST}"
          echo "Pushed ${IMAGE_REMOTE} and ${IMAGE_REMOTE_LATEST}"

          # GitHub has no public REST endpoint to change package visibility
          # (POST .../visibility is not in the Packages API and returns 404).
          # Read current visibility; if it is already public, continue. Otherwise
          # warn with the UI path and do not fail — the image is already on GHCR.
          PKG_HTML="https://github.com/orgs/${OWNER}/packages/container/${PKG}/settings"
          VISIBILITY=""
          set +e
          VISIBILITY="$(gh api "/orgs/${OWNER}/packages/container/${PKG}" --jq '.visibility' 2>/dev/null)"
          if [ -z "${VISIBILITY}" ]; then
            VISIBILITY="$(gh api "/users/${OWNER}/packages/container/${PKG}" --jq '.visibility' 2>/dev/null)"
            PKG_HTML="https://github.com/users/${OWNER}/packages/container/${PKG}/settings"
          fi
          set -e
          if [ "${VISIBILITY}" = "public" ]; then
            echo "GHCR package ${PKG} is already public."
          else
            echo "::warning::GHCR package '${PKG}' visibility is '${VISIBILITY:-unknown}'. GITHUB_TOKEN cannot change it (no Packages visibility API). Image tags were still pushed."
            echo "Make it public once (org owners): ${PKG_HTML} → Danger Zone → Change visibility → Public."
            echo "Also enable org Package Creation → Public: https://github.com/organizations/${OWNER}/settings/packages"
            {
              echo "### GHCR visibility"
              echo ""
              echo "Pushed \`${IMAGE_REMOTE}\` and \`${IMAGE_REMOTE_LATEST}\`."
              echo "Package visibility is **${VISIBILITY:-unknown}** (not flipped by this job)."
              echo "One-time UI: [package settings](${PKG_HTML}) → Danger Zone → Public."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create GitHub Release on master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ needs.integration.outputs.app_repository }}
        run: |
          set -euo pipefail
          META="${GITHUB_WORKSPACE}/${IMAGE_META}"
          if [ -f "${META}" ]; then
            set -a
            # shellcheck disable=SC1090
            . "${META}"
            set +a
          fi
          if [ -z "${IMAGE_TAG:-}" ] || [ -z "${IMAGE_REMOTE:-}" ]; then
            echo "::error::IMAGE_TAG/IMAGE_REMOTE missing. Expected ${IMAGE_META} in haystack-fast-api-release-docker-image."
            cat "${META}" || true
            exit 1
          fi
          TAG="v${IMAGE_TAG}"
          NOTES="$(
            printf '%s\n' \
              "Release **${TAG}** from \`master\`." \
              "" \
              "GHCR (public):" \
              "- \`docker pull ${IMAGE_REMOTE}\`" \
              "- \`docker pull ${IMAGE_REMOTE_LATEST}\`" \
              "" \
              "DAST: OWASP ZAP baseline + Dastardly (gate) and Nuclei (report-only)." \
              "Combined DAST PDF: \`combined-dast-report.pdf\` (artifact \`dast-combined-report-pdf\`)."
          )"
          mapfile -t ATTACH < <(find "${GITHUB_WORKSPACE}/release-package" "${GITHUB_WORKSPACE}/release-dast" -type f 2>/dev/null | sort)
          gh release create "${TAG}" \
            --repo "${GH_REPO}" \
            --target master \
            --title "${TAG}" \
            --notes "${NOTES}" \
            "${ATTACH[@]}"
          echo "Created GitHub Release ${TAG} on ${GH_REPO} (target master)."
