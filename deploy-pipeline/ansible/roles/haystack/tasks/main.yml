# Copied from estate ansible/roles/haystack. Same three services; env aliases (ADR 0004) + workers (ADR 0011).
---
- name: Haystack image is required
  ansible.builtin.assert:
    that:
      - haystack_image | default('') | length > 0
    fail_msg: >-
      Set extra-var haystack_image (ECR/GHCR tag or name loaded from image_http_url).
      Do not docker build. Do not start Neo4j on this host.

- name: Map SM keys to names the FastAPI app reads
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    import json
    from pathlib import Path
    path = Path("{{ env_path }}")
    data = {}
    order = []
    if path.is_file():
        for line in path.read_text().splitlines():
            if not line or line.lstrip().startswith("#") or "=" not in line:
                continue
            key, _, val = line.partition("=")
            if key not in data:
                order.append(key)
            data[key] = val
    for dest, src in (
        ("POSTGRES_HOSTNAME", "POSTGRES_HOST"),
        ("POSTGRES_DB", "POSTGRES_DATABASE"),
        ("POSTGRES_USER", "POSTGRES_USERNAME"),
        ("SOURCE_USER", "POSTGRES_USERNAME"),
        ("SOURCE_PASSWORD", "POSTGRES_PASSWORD"),
        ("SOURCE_DB", "SOURCE_DATABASE"),
        ("TARGET_USER", "POSTGRES_USERNAME"),
        ("TARGET_PASSWORD", "POSTGRES_PASSWORD"),
        ("TARGET_DB", "TARGET_DATABASE"),
        ("PGHOST", "TARGET_HOST"),
        ("PGPORT", "TARGET_PORT"),
        ("PGUSER", "TARGET_USER"),
        ("PGPASSWORD", "TARGET_PASSWORD"),
        ("PGDATABASE", "TARGET_DATABASE"),
    ):
        if not (data.get(dest) or "").strip() and (data.get(src) or "").strip():
            data[dest] = data[src]
            if dest not in order:
                order.append(dest)
    if not (data.get("PGHOST") or "").strip() and (data.get("POSTGRES_HOST") or "").strip():
        data["PGHOST"] = data["POSTGRES_HOST"]
        if "PGHOST" not in order:
            order.append("PGHOST")
    if not (data.get("PGDATABASE") or "").strip() and (data.get("POSTGRES_DATABASE") or "").strip():
        data["PGDATABASE"] = data["POSTGRES_DATABASE"]
        if "PGDATABASE" not in order:
            order.append("PGDATABASE")
    for key, val in (
        ("FLEET_BACKEND", "sql"),
        ("NEO4J_BACKEND", "bolt"),
        ("SYNC_INTERVAL_SECONDS", "60"),
        ("POPULATE_INTERVAL_SECONDS", "60"),
        ("POPULATE_TRIGGER_MODE", "both"),
        ("POPULATE_HTTP_ENABLED", "true"),
        ("NEO4J_POPULATE_TRIGGER_URL", "http://neo4j-populate:8089/v1/populate"),
    ):
        if not (data.get(key) or "").strip():
            data[key] = val
            if key not in order:
                order.append(key)
    # Haystack Environment academy overlay (project Profile knobs). Empty = keep SM.
    # Never take estate hosts from the project.
    overlay = json.loads('''{{ haystack_profile_overlay | default({}) | to_json }}''')
    forbidden = {
        "NEO4J_URI", "NEO4J_PASSWORD", "NEO4J_USER", "NEO4J_POPULATE_URL",
        "POSTGRES_HOST", "POSTGRES_HOSTNAME", "POSTGRES_PORT",
        "POSTGRES_DATABASE", "POSTGRES_DB", "POSTGRES_USERNAME", "POSTGRES_USER",
        "POSTGRES_PASSWORD", "POSTGRES_URL", "DATABASE_URL",
        "SOURCE_HOST", "SOURCE_PORT", "SOURCE_DATABASE",
        "TARGET_HOST", "TARGET_PORT", "TARGET_DATABASE",
    }
    if not isinstance(overlay, dict):
        overlay = {}
    for key, val in overlay.items():
        if key in forbidden:
            continue
        text = "" if val is None else str(val).strip()
        if not text:
            continue
        data[key] = text
        if key not in order:
            order.append(key)
    path.write_text("".join(f"{k}={data[k]}\n" for k in order))
    PY
    chmod 600 "{{ env_path }}"
  args:
    executable: /bin/bash
  no_log: true

- name: Worker script directory
  ansible.builtin.file:
    path: "{{ compose_dir }}/workers"
    state: directory
    mode: "0755"

- name: Install Haystack worker scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ compose_dir }}/workers/{{ item }}"
    mode: "0755"
  loop:
    - sync-from-primary.sh
    - populate_neo4j.py
    - populate-neo4j-from-haystack.sh

- name: Haystack compose (no neo4j service)
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ compose_dir }}/compose.yml"
    mode: "0644"

- name: Compose file must not start Neo4j
  ansible.builtin.command:
    argv: [grep, -E, "^[[:space:]]+neo4j:[[:space:]]*$", "{{ compose_dir }}/compose.yml"]
  register: neo4j_svc
  changed_when: false
  failed_when: neo4j_svc.rc == 0

- name: Compose Haystack
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ env_path }}"
      - -f
      - "{{ compose_dir }}/compose.yml"
      - up
      - -d
      - --remove-orphans
    chdir: "{{ compose_dir }}"

# ALB tg-haystack waits for GET <instance>:8000/health matcher 200-299.
# GET / is 404; /docs is OpenAPI only — not the ALB check.
- name: Haystack must answer 2xx on :8000/health
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/health
    status_code: "{{ range(200, 300) | list }}"
  register: hay_live
  retries: 30
  delay: 5
  until: hay_live is succeeded

- name: Worker status (does not fail the play)
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ compose_dir }}/compose.yml", ps]
    chdir: "{{ compose_dir }}"
  changed_when: false
  failed_when: false
